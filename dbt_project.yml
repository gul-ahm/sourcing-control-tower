name: logistics
version: "1.0"
profile: logistics

model-paths: [models]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  anomaly_pctile: 0.97
  risk_window_days: 90
  late_tolerance_days: 7
  min_receipts_for_stats: 8
  inventory_carrying_rate: 0.22

snapshot-paths: [snapshots]

models:
  logistics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
